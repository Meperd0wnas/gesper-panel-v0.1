# Publica el panel en GitHub Pages cada vez que cambia main (docs/DECISIONES.md §13).
# Lo que se publica es dist/sitio de scripts/empaquetar.js: src/, assets/, el
# manifiesto de producción, el instalador y la página de descarga. Nada más del
# repositorio llega al sitio.
#
# Requisito, una sola vez: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

name: Publicar panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Las pruebas no usan dependencias de npm: no hace falta npm install.
      - name: Pruebas
        run: node --test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Empaquetar
        run: node scripts/empaquetar.js --verificar-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
