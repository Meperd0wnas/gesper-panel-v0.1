<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel GESPER</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --gs:#1B63C7; --gs-w:#E7F0FC; --gs-dk:#144D9E;
  --ac:#C1440E; --ac-w:#FCEAE0; --ac-dk:#9E370A;
  --ok:#1E7A4D; --ok-w:#DEF2E7;
  --wn:#96650D; --wn-w:#FCF0DA;
  --cr:#A93A2B; --cr-w:#FAE3E0;
  --pane:#FFFFFF; --pane2:#F5F7F6; --sunk:#EBEFEE;
  --ink:#1A2320; --ink2:#3D4A46; --mut:#6A7975; --fnt:#96A29E;
  --ln:#DCE2E0; --ln2:#C4CECB;
  --shd:0 1px 2px rgba(20,30,28,.05), 0 1px 1px rgba(20,30,28,.04);
  --mono:Consolas,"Courier New",monospace;
  --ui:"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --gs:#6EA8F2; --gs-w:#132842; --gs-dk:#9AC2F7;
  --ac:#E8834A; --ac-w:#3A2410; --ac-dk:#F2A26C;
  --ok:#5DBB8E; --ok-w:#14301F;
  --wn:#D9A945; --wn-w:#33280F;
  --cr:#E0705C; --cr-w:#38201C;
  --pane:#151D1B; --pane2:#1B2422; --sunk:#101816;
  --ink:#E6EDEA; --ink2:#BFCCC8; --mut:#8D9C98; --fnt:#6B7A76;
  --ln:#27332F; --ln2:#35443F;
  --shd:0 1px 2px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--pane2);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:5px;border:2px solid var(--pane2)}
::-webkit-scrollbar-thumb:hover{background:var(--fnt)}

.brandbar{height:3px;flex:none;background:linear-gradient(90deg,var(--gs),var(--ac))}

header{background:var(--pane);border-bottom:1px solid var(--ln);padding:9px 12px;display:flex;align-items:center;gap:8px;flex:none}
header .lg{width:23px;height:23px;border-radius:6px;background:linear-gradient(135deg,var(--gs),var(--ac));color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono);flex:none;box-shadow:var(--shd)}
@media (prefers-color-scheme: dark){header .lg{color:#101816}}
header b{font-size:13.5px;letter-spacing:-.01em}
header .ver{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fnt)}
header button.rf{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--ln2);border-radius:5px;
  padding:4px 9px;font-size:11px;color:var(--gs);cursor:pointer;font-family:var(--ui);font-weight:600;
  transition:background .12s ease,border-color .12s ease}
header button.rf:hover{background:var(--gs-w);border-color:var(--gs)}
header button.rf .ic{transition:transform .5s ease;flex:none}
header button.rf.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav{display:flex;background:var(--pane);border-bottom:1px solid var(--ln);overflow-x:auto;flex:none}
nav button{flex:1 0 auto;background:none;border:none;border-bottom:2px solid transparent;padding:7px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;color:var(--mut);cursor:pointer;font-family:var(--ui);white-space:nowrap;
  transition:color .12s ease,border-color .12s ease}
nav button svg{width:15px;height:15px;flex:none}
nav button.on{color:var(--gs);border-bottom-color:var(--ac);font-weight:700}
nav button:hover{color:var(--ink)}
nav button:hover:not(.on){border-bottom-color:var(--ln2)}

main{flex:1;overflow-y:auto;padding:12px}
.scr{display:none}.scr.on{display:block;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

.sec{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fnt);margin:15px 0 6px}
.sec:first-child{margin-top:0}

.idc{background:var(--pane);border:1px solid var(--ln);border-left:3px solid var(--gs);border-radius:6px;padding:11px 12px;margin-bottom:12px;box-shadow:var(--shd)}
.idc .co{font-size:14.5px;font-weight:600;margin-bottom:2px}
.idc .mt{font-size:11px;color:var(--mut);font-family:var(--mono);line-height:1.65}

.sig{display:flex;gap:9px;align-items:flex-start;background:var(--pane);border:1px solid var(--ln);
  border-radius:6px;padding:10px 11px;margin-bottom:7px;box-shadow:var(--shd)}
.sig .lt{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;box-shadow:0 0 0 3px var(--sunk)}
.sig.k{border-left:3px solid var(--ok)}.sig.k .lt{background:var(--ok)}
.sig.w{border-left:3px solid var(--wn)}.sig.w .lt{background:var(--wn)}
.sig.c{border-left:3px solid var(--cr)}.sig.c .lt{background:var(--cr)}
.sig .tx{flex:1;min-width:0}
.sig .tt{font-size:12px;font-weight:600;margin-bottom:2px}
.sig .ds{font-size:11px;color:var(--mut);line-height:1.45}
.sig .ds b{color:var(--ink2)}
code{font-family:var(--mono);font-size:10px;background:var(--sunk);padding:1px 4px;border-radius:2px;color:var(--ink2)}

button.act{margin-top:6px;background:none;border:1px solid var(--ln2);border-radius:4px;padding:4px 9px;
  font-size:10.5px;color:var(--gs);cursor:pointer;font-family:var(--ui);font-weight:600;
  transition:background .12s ease,border-color .12s ease,transform .08s ease}
button.act:hover{background:var(--gs-w);border-color:var(--gs)}
button.act:active{transform:scale(.97)}
button.act.primary{color:#fff;background:var(--ac);border-color:var(--ac)}
button.act.primary:hover{background:var(--ac-dk);border-color:var(--ac-dk)}
button.act.ghost{color:var(--mut);border-color:var(--ln2)}
button.act.ghost:hover{background:var(--sunk);border-color:var(--ln2)}

.card{background:var(--pane);border:1px solid var(--ln);border-radius:6px;padding:10px 11px;margin-bottom:7px;box-shadow:var(--shd)}
.card h4{margin:0 0 2px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.card .v{font-family:var(--mono);font-size:13px;color:var(--ink)}
.card p{margin:3px 0 0;font-size:11px;color:var(--mut)}

.navb{width:100%;text-align:left;background:var(--pane);border:1px solid var(--ln);border-radius:5px;
  padding:9px 10px;margin-bottom:5px;cursor:pointer;font-family:var(--ui);display:flex;align-items:center;gap:9px;
  box-shadow:var(--shd);transition:border-color .12s ease,background .12s ease,transform .08s ease}
.navb:hover{border-color:var(--gs);background:var(--gs-w);transform:translateX(1px)}
.navb .ic{width:22px;height:22px;border-radius:5px;background:var(--gs-w);color:var(--gs);display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);font-weight:700;flex:none}
.navb .nm{font-size:12px;color:var(--ink);font-weight:500;display:block}
.navb .sb{font-size:10px;color:var(--mut);display:block;margin-top:1px}

.prow{width:100%;text-align:left;background:var(--pane);border:1px solid var(--ln);border-radius:5px;
  padding:7px 9px;margin-bottom:4px;cursor:pointer;font-family:var(--ui);
  display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;
  transition:border-color .12s ease,transform .08s ease}
.prow:hover{border-color:var(--gs);transform:translateX(1px)}
.prow .pn{font-family:var(--mono);font-size:10px;color:var(--fnt)}
.prow .pl{font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pb{font-family:var(--mono);font-size:11.5px;font-weight:700}
.prow .pb.g{color:var(--ok)}.prow .pb.r{color:var(--cr)}.prow .pb.n{color:var(--fnt)}
.prow .sub{grid-column:2/4;font-size:10px;margin-top:1px}

.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.fld .in{display:flex}
.fld input{flex:1;min-width:0;border:1px solid var(--ln2);border-radius:4px 0 0 4px;padding:6px 8px;
  font-size:12px;font-family:var(--mono);background:var(--pane);color:var(--ink);text-align:right}
.fld .un{border:1px solid var(--ln2);border-left:none;border-radius:0 4px 4px 0;padding:6px 7px;
  font-size:10.5px;color:var(--mut);background:var(--sunk);font-family:var(--mono);white-space:nowrap}
.fld .hp{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.fld input{transition:border-color .12s ease,background .12s ease}
.fld input:focus{outline:2px solid var(--gs);outline-offset:-1px}
.fld.dirty input{border-color:var(--wn);background:var(--wn-w)}

.yr{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:3px;margin-bottom:4px;align-items:center}
.yr .yl{font-family:var(--mono);font-size:9.5px;color:var(--fnt);text-align:right;padding-right:3px}
.yr .yh{font-family:var(--mono);font-size:9px;color:var(--fnt);text-align:center}
.yr input{border:1px solid var(--ln2);border-radius:3px;padding:5px 3px;font-size:10.5px;font-family:var(--mono);
  text-align:right;background:var(--pane);color:var(--ink);min-width:0;width:100%}
.yr input.dirty{border-color:var(--wn);background:var(--wn-w)}

.kpi{background:var(--pane);border:1px solid var(--ln);border-radius:6px;padding:9px 11px;margin-bottom:6px;box-shadow:var(--shd)}
.kpi .kl{font-size:10.5px;color:var(--mut);margin-bottom:1px}
.kpi .kv{font-size:18px;font-weight:600;letter-spacing:-.02em}
.kpi .ku{font-size:10.5px;color:var(--mut);font-weight:400;margin-left:3px}
.kpi .ks{font-family:var(--mono);font-size:9px;color:var(--fnt);margin-top:2px}
.kpi .nt{font-size:10px;color:var(--wn);margin-top:3px}

table.cmp{width:100%;border-collapse:collapse;font-size:11px}
table.cmp th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fnt);
  padding:5px 4px;border-bottom:1px solid var(--ln2);font-weight:600}
table.cmp th.c,table.cmp td.c{text-align:right;font-family:var(--mono)}
table.cmp td{padding:6px 4px;border-bottom:1px solid var(--ln);color:var(--ink2)}
table.cmp td.k{color:var(--ink);font-weight:500;font-family:var(--ui)}
table.cmp tbody tr{transition:background .12s ease}
table.cmp tbody tr:hover{background:var(--sunk)}
.vd{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:3px}
.vd.y{background:var(--ok-w);color:var(--ok)}.vd.n{background:var(--cr-w);color:var(--cr)}

.flag{background:var(--wn-w);border-left:3px solid var(--wn);padding:8px 10px;border-radius:4px;
  font-size:10.5px;color:var(--ink2);margin-top:9px;line-height:1.45}
.flag.gs{background:var(--gs-w);border-left-color:var(--gs)}

footer{border-top:1px solid var(--ln);background:var(--pane);padding:7px 12px;font-size:10px;
  color:var(--fnt);font-family:var(--mono);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s ease,color .15s ease}
footer.err{color:var(--cr);background:var(--cr-w)}
footer.ok{color:var(--ok);background:var(--ok-w)}

.load{padding:32px 12px;text-align:center;color:var(--mut);font-size:12px}
.load .spin{width:22px;height:22px;margin:0 auto 10px;border-radius:50%;border:2.5px solid var(--ln2);
  border-top-color:var(--gs);animation:spin .7s linear infinite}
.subnav{display:flex;border:1px solid var(--ln);border-radius:5px;background:var(--pane);margin-bottom:10px;overflow:hidden}
.subnav button{flex:1;background:none;border:none;padding:7px 4px;font-size:11px;color:var(--mut);cursor:pointer;
  font-family:var(--ui);transition:background .12s ease,color .12s ease}
.subnav button.on{background:var(--gs-w);color:var(--gs);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--gs);outline-offset:1px}
</style>
</head>
<body>

<div class="brandbar"></div>
<header>
  <span class="lg">G</span><b>GESPER</b>
  <span class="ver">v0.1</span>
  <button class="rf" id="btnRefresh" title="Volver a leer el libro">
    <svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>
    Actualizar
  </button>
</header>

<nav id="nav">
  <button data-s="estado" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
    Estado
  </button>
  <button data-s="navegar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2 12 12l-2.8 2.8L12 12z"/></svg>
    Navegar
  </button>
  <button data-s="datos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Datos
  </button>
  <button data-s="result">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Resultados
  </button>
  <button data-s="alt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
    Alternativas
  </button>
</nav>

<main>
  <div class="scr on" id="s-estado"><div class="load"><div class="spin"></div>Leyendo el libro…</div></div>
  <div class="scr" id="s-navegar"></div>
  <div class="scr" id="s-datos"></div>
  <div class="scr" id="s-result"></div>
  <div class="scr" id="s-alt"></div>
</main>

<footer id="foot">Iniciando…</footer>

<script>
"use strict";

/* ============================================================
   MAPA DE CELDAS  —  única fuente de verdad del panel.
   Cambiar de versión de plantilla = cambiar este bloque.
   Todas las direcciones fueron verificadas contra la v2.5.
   ============================================================ */
var H = {
  ALT: "Alternativas",
  PAR: "PARÁMETROS",
  EVT: "EV PROG TÉCNICOS",
  EVC: "EV PROG CCIALES",
  FCJ: "FCAJA PROYECTO TASA 16,28",
  RFI: "RESUMEN FINANCIERO",
  CON: "Consolidado Programas"
};

var LECTURAS = [
  ["prog",    H.ALT, "A6:E24"],   // tabla PROGRAMAS: nombre, n, VNA ing, VNA egr, B/C
  ["ct005",   H.ALT, "Y27:Y29"],  // controles de integridad
  ["monto",   H.ALT, "B4"],
  ["minbc",   H.ALT, "E4"],
  ["selA1",   H.ALT, "I4"],
  ["bcA1",    H.ALT, "I5"],
  ["meta",    H.ALT, "S3"],
  ["flagsV",  H.ALT, "I7:AA7"],   // banderas de vista (Alternativa 1)
  ["flags2",  H.ALT, "I49:AA49"], // banderas que alimentan el consolidado (Alternativa 2)
  ["flags3",  H.ALT, "I91:AA91"],
  ["a1bc",    H.ALT, "K4:K5"],
  ["a2txt",   H.ALT, "I46:I47"],
  ["a2bc",    H.ALT, "K46:K47"],
  ["a3txt",   H.ALT, "I88:I89"],
  ["a3bc",    H.ALT, "K88:K89"],
  ["ver1",    H.ALT, "T22"],
  ["ver2",    H.ALT, "T63"],
  ["ver3",    H.ALT, "T105"],
  ["anios",   H.ALT, "J9:V9"],
  ["ianc1",   H.ALT, "J17:V17"],
  ["ipuf1",   H.ALT, "J20:V20"],
  ["ianc2",   H.ALT, "J59:V59"],
  ["ipuf2",   H.ALT, "J62:V62"],
  ["par",     H.PAR, "C4:C18"],
  ["parE",    H.PAR, "E8:E9"],
  ["grad",    H.PAR, "C33"],
  ["fcaja",   H.FCJ, "C65:C67"],
  ["tirm",    H.FCJ, "D66"],
  ["empresa", H.EVC, "F2"],
  ["metodo",  H.EVC, "C34"],
  ["p9a",     H.EVC, "C181"],
  ["p9b",     H.EVC, "C200"],
  ["p9c",     H.EVC, "C246"],
  ["p9rep",   H.EVC, "F197:J197"],
  ["p9nue",   H.EVC, "F198:J198"],
  ["p9anios", H.EVC, "F190:J190"]
];

/* Bloques de navegación */
var BLOQUES = [
  {n:"Configuración global", s:"PARÁMETROS · INDICES · BANREPÚBLICA · PROYEC SUSC", ir:[H.PAR,"B3"]},
  {n:"Catálogos y costos unitarios", s:"C UNIT PROG TÉCNICOS · C UNIT PROG CCIALES", ir:["C UNIT PROG TÉCNICOS","B8"]},
  {n:"Componente técnico", s:"EV PROG TÉCNICOS · PROG TÉCNICOS", ir:[H.EVT,"D108"]},
  {n:"Componente comercial", s:"EV PROG CCIALES · PROG CCIALES", ir:[H.EVC,"C23"]},
  {n:"Consolidación financiera", s:"RESUMEN FINANCIERO · 19 hojas B/C", ir:[H.RFI,"B2"]},
  {n:"Alternativas y resultados", s:"Alternativas · Consolidado · FCAJA · EVOLUCION BH", ir:[H.ALT,"A4"]}
];

/* Anclas verificadas de tramos de entrada por programa.
   Donde no hay ancla verificada, el panel busca la fila por su rótulo. */
var ANCLAS = {
  1:  [H.EVT, "D108:D109", "Macromedición · captación"],
  9:  [H.EVC, "C181",      "Renovación de medidores"],
  10: [H.EVC, "B275",      "Gestión de fraudes"],
  11: [H.EVC, "B293",      "Cobro de consumos por obras"],
  12: [H.EVC, "B310",      "Seguimiento consumo 0"],
  13: [H.EVC, "B328",      "Seguimiento de anomalías"],
  14: [H.EVC, "B346",      "Medidores grandes consumidores"],
  15: [H.EVC, "B364",      "Catastro de usuarios"],
  17: [H.EVC, "B401",      "Telemetría grandes consumidores"],
  18: [H.EVC, "B417",      "Software de inteligencia"]
};

/* ============================================================ */

var D = {};              // datos leídos del libro
var hojasLibro = [];     // nombres de hojas presentes
var pantalla = "estado";
var subResult = "hid";
var vistaDatos = "lista";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function foot(msg, cls){ var f=$("foot"); f.textContent=msg; f.className=cls||""; }
function num(v){ return (typeof v==="number" && isFinite(v)) ? v : null; }
function fmt(v,d){ var n=num(v); if(n===null) return "—";
  return n.toLocaleString("es-CO",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fmtMM(v){ var n=num(v); if(n===null) return "—"; return fmt(n/1e6,0); }

/* ---------- LECTURA ---------- */
async function leerLibro(){
  foot("Leyendo el libro…");
  await Excel.run(async function(ctx){
    var wss = ctx.workbook.worksheets;
    wss.load("items/name");
    await ctx.sync();
    hojasLibro = wss.items.map(function(s){ return s.name; });

    var pend = [];
    LECTURAS.forEach(function(L){
      var key=L[0], hoja=L[1], addr=L[2];
      if (hojasLibro.indexOf(hoja) < 0) return;
      var rg = wss.getItem(hoja).getRange(addr);
      rg.load("values,text");
      pend.push([key, rg]);
    });
    await ctx.sync();
    D = {};
    pend.forEach(function(p){ D[p[0]] = { v:p[1].values, t:p[1].text }; });
  });
}

/* ---------- ESCRITURA PROTEGIDA ---------- */
async function escribir(hoja, addr, valores){
  await Excel.run(async function(ctx){
    var sh = ctx.workbook.worksheets.getItem(hoja);
    var rg = sh.getRange(addr);
    rg.load("formulas,address");
    await ctx.sync();

    for (var i=0;i<rg.formulas.length;i++){
      for (var j=0;j<rg.formulas[i].length;j++){
        var f = rg.formulas[i][j];
        if (typeof f === "string" && f.charAt(0) === "="){
          throw new Error("La celda " + rg.address + " contiene una fórmula. El panel no la sobrescribe.");
        }
      }
    }
    rg.values = valores;
    ctx.workbook.application.calculate(Excel.CalculationType.full);
    await ctx.sync();
  });
}

/* ---------- NAVEGACIÓN EN EL LIBRO ---------- */
async function irA(hoja, addr){
  if (hojasLibro.indexOf(hoja) < 0){ foot("No existe la hoja " + hoja, "err"); return; }
  try{
    await Excel.run(async function(ctx){
      var sh = ctx.workbook.worksheets.getItem(hoja);
      sh.visibility = Excel.SheetVisibility.visible;
      sh.activate();
      if (addr) sh.getRange(addr).select();
      await ctx.sync();
    });
    foot(hoja + (addr ? ("!" + addr) : ""), "ok");
  }catch(e){ foot("No pude abrir " + hoja + ": " + e.message, "err"); }
}

/* Busca la fila de un rótulo en la columna B y salta ahí */
async function irAEtiqueta(hoja, texto){
  if (hojasLibro.indexOf(hoja) < 0){ foot("No existe la hoja " + hoja, "err"); return; }
  try{
    var fila = 0;
    await Excel.run(async function(ctx){
      var sh = ctx.workbook.worksheets.getItem(hoja);
      var col = sh.getRange("B1:B900");
      col.load("text");
      await ctx.sync();
      var t = texto.toUpperCase();
      for (var i=0;i<col.text.length;i++){
        var c = String(col.text[i][0]||"").toUpperCase();
        if (c.indexOf(t) >= 0){ fila = i+1; break; }
      }
    });
    if (fila) await irA(hoja, "B"+fila);
    else { await irA(hoja); foot("No encontré «"+texto+"»; abrí la hoja", "err"); }
  }catch(e){ foot("Error buscando: " + e.message, "err"); }
}

/* ---------- PROGRAMAS ---------- */
function programas(){
  var out = [];
  if (!D.prog) return out;
  for (var i=0;i<D.prog.v.length;i++){
    var f = D.prog.v[i];
    var nom = String(f[0]||"").trim();
    if (!nom) continue;
    var n = num(f[1]);
    if (n === null) continue;
    out.push({ n:n, nombre:nom, ing:num(f[2]), egr:num(f[3]), bc:num(f[4]),
               nota: (typeof f[2]==="string" && f[2]) ? String(f[2]) : "" });
  }
  return out;
}

async function guardarP9(){
  try{
    foot("Guardando…");
    var pa = parseNum($("f_a").value), pb = parseNum($("f_b").value), pc = parseNum($("f_c").value);
    if (pa===null||pb===null||pc===null) throw new Error("Hay un campo que no es un número válido.");
    if (pc < 1 || pc > 12) foot("Aviso: los meses de recuperación suelen estar entre 1 y 12.", "err");

    var rep = [], nue = [];
    for (var i=0;i<5;i++){
      var r = parseNum($("r"+i).value), n = parseNum($("n"+i).value);
      if (r===null||n===null) throw new Error("Hay un valor de año que no es un número válido.");
      rep.push(r); nue.push(n);
    }
    await escribir(H.EVC, "C181", [[pa]]);
    await escribir(H.EVC, "C200", [[pb]]);
    await escribir(H.EVC, "C246", [[pc]]);
    await escribir(H.EVC, "F197:J197", [rep]);
    await escribir(H.EVC, "F198:J198", [nue]);
    await leerLibro();
    pintaTodo();
    foot("Guardado y recalculado.", "ok");
  }catch(e){ foot(e.message, "err"); }
}
function parseNum(s){
  if (s===null||s===undefined) return null;
  s = String(s).trim();
  if (!s) return null;
  s = s.replace(/\./g,"").replace(/,/g,".").replace(/[^0-9.\-]/g,"");
  var n = parseFloat(s);
  return isFinite(n) ? n : null;
}

function sparkIPUF(){
  var v = D.ipuf2 ? D.ipuf2.v[0].map(num) : [];
  var an = D.anios ? D.anios.t[0] : [];
  var meta = D.meta ? num(D.meta.v[0][0]) : null;
  var pts = [];
  for (var i=0;i<v.length;i++){ if (v[i]!==null) pts.push([i, v[i]]); }
  if (pts.length < 2) return "";
  var ys = pts.map(function(p){return p[1];}).concat(meta!==null?[meta]:[]);
  var mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys);
  if (mx-mn < 0.2){ mx += 0.2; mn -= 0.2; }
  var W=290,Hh=88,PL=26,PR=8,PT=10,PB=18;
  function X(i){ return PL + (W-PL-PR) * (i/(v.length-1)); }
  function Y(y){ return PT + (Hh-PT-PB) * (1-(y-mn)/(mx-mn)); }
  var poly = pts.map(function(p){ return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join(" ");
  var s = '<div class="card"><h4>Trayectoria de IPUF</h4><svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto" role="img" aria-label="IPUF por año">';
  if (meta!==null){
    s += '<line x1="'+PL+'" y1="'+Y(meta).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(meta).toFixed(1)+
         '" stroke="var(--cr)" stroke-width="1" stroke-dasharray="3 3"/>';
    s += '<text x="'+(PL+2)+'" y="'+(Y(meta)-3).toFixed(1)+'" font-size="8" fill="var(--cr)" font-family="Consolas,monospace">meta '+fmt(meta,1)+'</text>';
  }
  s += '<polyline fill="none" stroke="var(--gs)" stroke-width="2" points="'+poly+'"/>';
  var last = pts[pts.length-1];
  s += '<circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="2.5" fill="var(--gs)"/>';
  s += '<text x="2" y="'+(Y(mx)+3).toFixed(1)+'" font-size="8" fill="var(--fnt)" font-family="Consolas,monospace">'+fmt(mx,1)+'</text>';
  s += '<text x="2" y="'+(Y(mn)+3).toFixed(1)+'" font-size="8" fill="var(--fnt)" font-family="Consolas,monospace">'+fmt(mn,1)+'</text>';
  if (an.length){
    s += '<text x="'+PL+'" y="'+(Hh-4)+'" font-size="8" fill="var(--fnt)" font-family="Consolas,monospace">'+esc(an[0])+'</text>';
    s += '<text x="'+(W-PR-26)+'" y="'+(Hh-4)+'" font-size="8" fill="var(--fnt)" font-family="Consolas,monospace">'+esc(an[an.length-1])+'</text>';
  }
  return s + '</svg></div>';
}

function pintaAlt(){

    var ben = bcRange ? num(bcRange.v[0][0]) : null;
    var cos = bcRange ? num(bcRange.v[1][0]) : null;
    return { ben:ben, cos:cos, bc: (ben!==null&&cos!==null&&cos!==0) ? ben/cos : null };
  }
  var A1 = bloque(D.a1bc), A2 = bloque(D.a2bc), A3 = bloque(D.a3bc);
  function promIPUF(k){
    if (!D[k]) return null;
    var v = D[k].v[0].map(num).filter(function(x){return x!==null;});
    if (v.length < 4) return null;
    var s = v.slice(3);
    return s.reduce(function(a,b){return a+b;},0)/s.length;
  }
  var i1 = promIPUF("ipuf1"), i2 = promIPUF("ipuf2");
  function cumple(vr){ if(!vr) return null; var t=String(vr.t[0][0]||"");
    if (t.indexOf("NO CUMPLE")>=0) return false; if (t.indexOf("CUMPLE")>=0) return true; return null; }
  var c1=cumple(D.ver1), c2=cumple(D.ver2), c3=cumple(D.ver3);
  function vd(c){ return c===null ? "—" : '<span class="vd '+(c?"y":"n")+'">'+(c?"SÍ":"NO")+'</span>'; }
  function bcCel(x){ if(x===null) return "—";
    return '<span style="color:'+(x>=1?"var(--ok)":"var(--cr)")+';font-weight:700">'+fmt(x,2)+'</span>'; }

  var h = '<div class="sec">Comparación</div><table class="cmp"><thead><tr><th></th>' +
          '<th class="c">Alt. 1</th><th class="c">Alt. 2</th><th class="c">Alt. 3</th></tr></thead><tbody>';
  h += '<tr><td class="k">Beneficio</td><td class="c">'+fmtMM(A1.ben)+'</td><td class="c">'+fmtMM(A2.ben)+'</td><td class="c">'+fmtMM(A3.ben)+'</td></tr>';
  h += '<tr><td class="k">Costo</td><td class="c">'+fmtMM(A1.cos)+'</td><td class="c">'+fmtMM(A2.cos)+'</td><td class="c">'+fmtMM(A3.cos)+'</td></tr>';
  h += '<tr><td class="k">Relación B/C</td><td class="c">'+bcCel(A1.bc)+'</td><td class="c">'+bcCel(A2.bc)+'</td><td class="c">'+bcCel(A3.bc)+'</td></tr>';
  h += '<tr><td class="k">IPUF promedio</td><td class="c">'+(i1!==null?fmt(i1,2):"—")+'</td><td class="c">'+(i2!==null?fmt(i2,2):"—")+'</td><td class="c">—</td></tr>';
  h += '<tr><td class="k">Meta IPUF</td><td class="c">'+vd(c1)+'</td><td class="c">'+vd(c2)+'</td><td class="c">'+vd(c3)+'</td></tr>';
  h += '</tbody></table><p style="font-size:10px;color:var(--fnt);font-family:var(--mono);margin:6px 0 0">cifras en millones de pesos corrientes</p>';

  h += '<div class="flag gs"><b>La Alternativa 2 es la que alimenta el consolidado financiero.</b> Es la fila 49 de la hoja Alternativas la que gobierna todo lo que viene después.</div>';

  h += '<div class="sec">Alternativa 1 · propuesta por el motor</div>';
  h += '<div class="card"><div class="v" style="font-size:11px;line-height:1.7">' +
       (D.selA1 ? (esc(D.selA1.t[0][0]) || "sin elegir") : "—") + '</div></div>';
  h += '<div class="sec">Alternativa 2 · compuesta a mano</div>';
  h += '<div class="card"><div class="v" style="font-size:11px;line-height:1.7">' +
       (D.a2txt ? (esc(D.a2txt.t[0][0]) || "sin componer") : "—") + '</div></div>';
  h += '<div class="sec">Alternativa 3</div>';
  h += '<div class="card"><div class="v" style="font-size:11px;line-height:1.7">' +
       (D.a3txt ? (esc(D.a3txt.t[0][0]) || "sin componer") : "—") + '</div></div>';

  h += '<button class="act" style="margin-top:10px;width:100%;padding:8px" data-hoja="'+esc(H.ALT)+'" data-addr="A4">Abrir la hoja Alternativas</button>';
  $("s-alt").innerHTML = h;
}

/* ---------- ORQUESTACIÓN ---------- */
function pintaTodo(){
  try{ pintaEstado(); }catch(e){ $("s-estado").innerHTML = errBox(e); }
  try{ pintaNavegar(); }catch(e){ $("s-navegar").innerHTML = errBox(e); }
  try{ pintaDatos(); }catch(e){ $("s-datos").innerHTML = errBox(e); }
  try{ pintaResultados(); }catch(e){ $("s-result").innerHTML = errBox(e); }
  try{ pintaAlt(); }catch(e){ $("s-alt").innerHTML = errBox(e); }
}
function errBox(e){
  return '<div class="sig c"><span class="lt"></span><div class="tx"><div class="tt">No pude pintar esta sección</div>' +
         '<div class="ds">' + esc(e && e.message ? e.message : e) + '</div></div></div>';
}
function mostrar(id){
  pantalla = id;
  var s = document.querySelectorAll(".scr");
  for (var i=0;i<s.length;i++) s[i].className = "scr" + (s[i].id === "s"+"-"+id ? " on" : "");
  var b = document.querySelectorAll("#nav button");
  for (var j=0;j<b.length;j++) b[j].className = (b[j].getAttribute("data-s") === id ? "on" : "");
}

async function refrescar(){
  var btn = $("btnRefresh");
  if (btn) btn.classList.add("spin");
  try{
    await leerLibro();
    pintaTodo();
    foot("Leído · " + hojasLibro.length + " hojas · " + new Date().toLocaleTimeString("es-CO"), "ok");
  }catch(e){
    foot("Error leyendo el libro: " + (e && e.message ? e.message : e), "err");
    $("s-estado").innerHTML = errBox(e);
  }finally{
    if (btn) btn.classList.remove("spin");
  }
}

/* ---------- EVENTOS ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target;

  var nb = t.closest ? t.closest("#nav button") : null;
  if (nb){ mostrar(nb.getAttribute("data-s")); return; }

  var sr = t.closest ? t.closest("#subR button") : null;
  if (sr){ subResult = sr.getAttribute("data-r"); pintaResultados(); return; }

  var go = t.closest ? t.closest("[data-go]") : null;
  if (go){ mostrar(go.getAttribute("data-go")); return; }

  var ir = t.closest ? t.closest("[data-hoja]") : null;
  if (ir){ irA(ir.getAttribute("data-hoja"), ir.getAttribute("data-addr")); return; }

  var vb = t.closest ? t.closest("[data-volver]") : null;
  if (vb){ vistaDatos = "lista"; pintaDatos(); return; }

  var pr = t.closest ? t.closest("[data-prog]") : null;
  if (pr){
    var n = parseInt(pr.getAttribute("data-prog"),10);
    if (n === 9){ vistaDatos = "p9"; mostrar("datos"); pintaDatos(); irA(H.EVC,"C181"); }
    else if (ANCLAS[n]){ irA(ANCLAS[n][0], ANCLAS[n][1]); }
    else { irAEtiqueta(H.EVT, String(n)+"."); }
    return;
  }

  if (t.id === "btnRefresh"){ refrescar(); return; }
  if (t.id === "btnGuardar"){ guardarP9(); return; }
  if (t.id === "btnDescartar"){ pintaFormP9(); foot("Cambios descartados."); return; }
});

document.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.tagName === "INPUT"){
    if (t.closest(".fld")) t.closest(".fld").className = "fld dirty";
    else t.className = "dirty";
  }
});

/* ---------- ARRANQUE ---------- */
Office.onReady(function(info){
  if (info.host !== Office.HostType.Excel){
    document.body.innerHTML = '<div class="load">Este panel solo funciona dentro de Excel.</div>';
    return;
  }
  refrescar();
});
</script>
